# Cloudflare deployment: one Worker serves the API, the static client and the cron poller.
#
#   npm run web:build          # apps/web -> apps/web/dist, which [assets] below uploads
#   npx wrangler d1 create uni-dashboard     # once, then paste the id into database_id
#   npx wrangler secret put PORTAL_ICS_URL   # and LEARN_ICS_URL
#   npx wrangler deploy
#
# Nothing here is secret. Token feed URLs are Worker secrets, never vars.
#
# Auth is Cloudflare Access, verified again inside the Worker (apps/relay/src/access.mjs). Every /v1
# route answers 503 until both values below are set, so a deploy cannot go out open by accident.
#   ACCESS_TEAM_DOMAIN  Zero Trust > Settings > Custom Pages, e.g. https://<team>.cloudflareaccess.com
#   ACCESS_AUD          Zero Trust > Access > Applications > this app > Overview > Application Audience (AUD) Tag
name = "uni-dashboard"
main = "apps/relay/src/worker.mjs"
compatibility_date = "2026-09-01"
# nodejs_compat enables invocation-scoped AsyncLocalStorage and shared Buffer/Blob paths.
# Node-only SQLite and filesystem operations remain in local adapters/development paths.
compatibility_flags = ["nodejs_compat"]

[vars]
ACCESS_TEAM_DOMAIN = "https://peterfat11.cloudflareaccess.com"
ACCESS_AUD = "89094f50761aeba9685fa28a5bb0fb32bfddbbc4835411eed56020e7fff40ae3"
# Optional: when `/mcp` is served on its own hostname with its own Access application, put that
# application's AUD tag here. /mcp then accepts only assertions minted for the agent app, so a
# dashboard session cannot open the MCP endpoint. See docs/MCP.md.
# MCP_ACCESS_AUD = ""
# How the MCP endpoint authenticates: "access" (default) requires the Cloudflare Access
# assertion; "token" accepts application API keys minted by the owner and means Access is not
# required for /mcp; "both" accepts either. Set to "both" because the hub agent authenticates with
# an application API key on an Access-bypassed /mcp path. See docs/MCP.md.
MCP_AUTH_MODE = "both"

# The Vite client, served from the same origin as /v1 so there is no CORS path anywhere.
# single-page-application means unknown paths fall back to index.html instead of 404.
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# APIs, the HTTPS OAuth handoff and the MCP endpoint must reach the Worker instead of the SPA
# asset fallback. The two RFC 9728 discovery paths are listed too: an MCP client reads them before
# it holds any credential, so they must be served by the Worker rather than rendered as the shell.
run_worker_first = ["/v1/*", "/healthz", "/oauth/android/callback", "/mcp", "/.well-known/*"]

# Canonical rows. D1 is SQLite, which is the dialect the storage interface was written against.
# The schema is created by D1Store.init() on first use (CREATE TABLE IF NOT EXISTS), so there is no
# migration step to run by hand.
[[d1_databases]]
binding = "DB"
database_name = "uni-dashboard"
database_id = "f20601f5-fcb6-43ab-9bb6-aa636b418df5"

# Workers AI: the dining advisor calls env.AI.run(), so no CLOUDFLARE_API_TOKEN is needed on the
# Worker and there is no REST round trip.
[ai]
binding = "AI"

# The status source is due every minute. The cron must wake at least that often; jobs for slower
# sources retain their own cadence and only run when due.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
